# Main grid: centralized (compute-matched) vs FedAvg vs FedProx, 3 seeds each.
base:
  num_clients: 10
  rounds: 100
  local_epochs: 2
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  hidden: 256
  min_client_size: 100
runs:
  - {mode: central, seed: [0, 1, 2]}
  - {mode: fedavg, alpha: [iid, 0.5, 0.1], seed: [0, 1, 2]}
  - {mode: fedprox, alpha: [iid, 0.5, 0.1], mu: MU_PLACEHOLDER, seed: [0, 1, 2]}
